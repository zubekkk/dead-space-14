- type: entity
  id: SpiderFoot
  name: spider foot
  components:
  - type: Physics
    bodyType: Kinematic
    canCollide: true
  - type: Fixtures
    fixtures:
      foot:
        shape: !type:PhysShapeCircle
          radius: 0.3
        hard: true
        layer:
        - MobLayer
        mask: []
  - type: Damageable
    damageContainer: Inorganic
  - type: SpiderFoot
  - type: RequireProjectileTarget
  - type: Clickable
    bounds:
      all: "-0.3,-0.3,0.3,0.3"
  - type: Tag
    tags:
    - SpiderMissilesBlacklist

- type: entity
  id: MobBossSpider
  name: паук
  description: паук
  suffix: Mango19
  components:
  - type: InteractionOutline
  - type: Clickable
  - type: ComplexInteraction
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: MindContainer
  - type: Tag
    tags:
    - SpiderMissilesBlacklist
  - type: BlockMovement
    blockInteraction: false
  - type: Sprite
    sprite: _DeadSpace/MangoSpiderBoss/spider_body.rsi
    drawdepth: OverMobs
    layers: 
    - state: main
    - state: main-unshaded
      shader: unshaded
    - map: [ "missiles" ]
      sprite: _DeadSpace/MangoSpiderBoss/spider_missiles.rsi
      state: wait
      loop: false
  - type: GenericVisualizer
    visuals: 
      enum.SpiderBossMissiles.Animation:
        missiles:
          Idle: {state: wait}
          Firing: {state: open}
          Starting: {state: start}
          Closing: {state: close}
  - type: Appearance
  - type: Physics
    bodyType: KinematicController
    bodyStatus: OnGround
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 1.25
        density: 3500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageContainer: Inorganic
  - type: SpiderMarkerFollow
    speed: 2.5
    turnSpeed: 3
    stopDistance: 0.1
  - type: SpiderMissilesLauncher
    missilesStartLaunchSound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    missilesCloseSound:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    startLauncherTime: 1
    closeLauncherTime: 1
    missileLaunchInterval: 0.75
    missileLaunchCount: 4
    napalmMissileLaunchCount: 4
    missilesEffects:
    - prototype: SpiderTestMissileEffectFlash
      offset: "0.5, 1.4"
      rotation: 50
    - prototype: SpiderTestMissileEffectFlash
      offset: "-0.5, 1.4"
      rotation: 140
    - prototype: SpiderTestMissileEffectNapalm2
      offset: "0.5, 1.4"
      rotation: -40
      parentToLauncher: false
    - prototype: SpiderTestMissileEffectNapalm2
      offset: "-0.5, 1.4"
      rotation: 50
      parentToLauncher: false
    napalmMissilesEffects:
    - prototype: SpiderTestMissileEffectFlash
      offset: "0.5, 1.4"
      rotation: 50
    - prototype: SpiderTestMissileEffectFlash
      offset: "-0.5, 1.4"
      rotation: 140
    - prototype: SpiderTestMissileEffectNapalm2
      offset: "0.5, 1.4"
      rotation: 50
    - prototype: SpiderTestMissileEffectNapalm2
      offset: "-0.5, 1.4"
      rotation: 140
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: SpiderLegs
    boneLengths: [ 1.0, 0.7, 0.7 ]
    boneVisuals:
    - layers:
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/upper_leg.rsi
          state: main
        #scale: 0.3, 1.4
        #shader: unshaded
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/upper_leg.rsi
          state: main-unshaded
        #scale: 0.3, 1.4
        shader: unshaded
    - layers:
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/lower_leg.rsi
          state: main
        #scale: 0.3, 1.4
        #shader: unshaded
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/lower_leg.rsi
          state: main-unshaded
        #scale: 0.3, 1.4
        shader: unshaded
    - layers:
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/lower_leg.rsi
          state: main
        #scale: 0.3, 1.4
        #shader: unshaded
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/lower_leg.rsi
          state: main-unshaded
        #scale: 0.3, 1.4
        shader: unshaded
    footVisual:
      layers:
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/foot.rsi
          state: main
        #scale: 0.3, 1.4
        #shader: unshaded
      - sprite:
          sprite: _DeadSpace/MangoSpiderBoss/foot.rsi
          state: main-unshaded
        #scale: 0.3, 1.4
        shader: unshaded
    stepThreshold: 0.7
    stepDuration: 0.3
    footstepSound:
      collection: FootstepThud
    lookahead: 0.25
    maxLookaheadOffset: 0.5
    minFootGap: 0.6
    footDamageShare: 0.3
    legs:
    # Правые
    - position: "0.5,-0.75"
      rest: "1.6,-2.4"
      group: 0
      legMaxHealth: 40
    - position: "0.5,-0.5"
      rest: "1.9,-1.5"
      group: 1
      legMaxHealth: 40
    - position: "0.45,-0.2"
      rest: "1.9,0"
      group: 0
      legMaxHealth: 40
    - position: "0.35,0"
      rest: "1.6,1"
      group: 1
      legMaxHealth: 40
    # Левые
    - position: "-0.5,-0.75"
      rest: "-1.6,-2.4"
      group: 1
      legMaxHealth: 40
    - position: "-0.5,-0.5"
      rest: "-1.9,-1.5"
      group: 0
      legMaxHealth: 40
    - position: "-0.45,-0.2"
      rest: "-1.9,0"
      group: 1
      legMaxHealth: 40
    - position: "-0.35,0"
      rest: "-1.6,1"
      group: 0
      legMaxHealth: 40

- type: entity
  id: SpiderMarker
  name: marker
  save: false
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
    scale: 1, 1
    drawdepth: Overlays

- type: entity
  id: SpiderDebugHipMarker
  parent: SpiderMarker
  save: false
  components:
  - type: Sprite
    scale: 0.5, 0.5

- type: entity
  id: SpiderDebugRestMarker
  parent: SpiderMarker
  save: false
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: green
    scale: 0.5, 0.5

- type: entity
  id: SpiderMissileMarker
  parent: SpiderMarker
  save: false
  components:
  - type: SpiderMissileMarker
    radius: 6
    attachDuration: 3
    spawnDelay: 1
    deleteDelay: 1
    spawnPrototype: SpiderTestMissileEffectNapalm
    blacklist:
      tags:
      - SpiderMissilesBlacklist

- type: entity
  id: SpiderNapalmMissileMarker
  save: false
  components:
  - type: Sprite
    sprite: _DeadSpace/MangoSpiderBoss/marker.rsi
    layers: 
    - state: marker
      shader: unshaded
      scale: 1.5, 1.5
    drawdepth: BelowMobs
    offset: "0.0,-0.5"
    noRot: true
  - type: SpiderMissileMarker
    radius: 6
    attachDuration: 3
    spawnDelay: 1
    deleteDelay: 1
    spawnPrototype: SpiderTestMissileEffectNapalm
    blacklist:
      tags:
      - SpiderMissilesBlacklist
